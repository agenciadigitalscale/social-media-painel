# CI do DS HUB — o que roda entre o commit e a produção.
#
# Por que existe: o Cloudflare Pages publica sozinho a cada push na `main`.
# Até 2026-09-01 NADA rodava nesse caminho — os testes, o typecheck e o build
# só valiam quando alguém lembrava de rodar na mão, antes de empurrar.
#
# ⚠️ Isto por si só ainda NÃO impede um deploy quebrado: o Pages constrói a
# partir do push, em paralelo com este workflow, e não espera por ele. O que
# se ganha aqui é saber em ~2 minutos que a main quebrou, com o passo exato
# que falhou. Para virar um portão de verdade, ver o fim deste arquivo.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Push novo na mesma branch cancela a verificação anterior: ninguém precisa do
# resultado de um commit que já foi substituído, e isso libera a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · lint · testes · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma major do ambiente de desenvolvimento (v24). Sem isso o CI
          # pode passar numa versão e a máquina de quem programa, em outra.
          node-version: '24'
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # package-lock.json e falha se os dois estiverem fora de sincronia — que
      # é justamente o tipo de divergência que só aparece em produção.
      - name: Instalar dependências
        run: npm ci

      # Passos separados de propósito: o nome do passo vermelho já diz o que
      # quebrou, sem precisar abrir o log.
      - name: Typecheck
        run: npm run typecheck

      # O lint sai 0 hoje. Os ~109 avisos são do React Compiler, que o projeto
      # não usa — eles não quebram nada. `rules-of-hooks` continua sendo erro,
      # e essa é a regra que derruba o React de verdade.
      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  # ── O PORTÃO: publica só depois do verde ──────────────────────────────────
  #
  # Este job faz o que o Cloudflare fazia sozinho — buildar e publicar — só que
  # DEPOIS de `verificar` passar (`needs`). O ganho é o que faltava: código que
  # quebra typecheck/lint/teste/build não chega ao cliente, porque o deploy nem
  # roda.
  #
  # Nasce DORMENTE de propósito. Enquanto a variável `CI_DEPLOY` não for `true`,
  # ele não executa e o Cloudflare segue publicando pelo Git — sem essa trava,
  # ligar o job criaria DOIS deploys concorrentes no mesmo push, um pisando no
  # outro. A troca é atômica: o dono desliga o auto-deploy do Cloudflare e liga
  # `CI_DEPLOY` na mesma sentada (passos no fim do arquivo).
  deploy:
    name: Deploy · Cloudflare Pages
    needs: verificar
    if: github.ref == 'refs/heads/main' && vars.CI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # As Functions vão junto: o wrangler.toml declara os bindings do D1 e do
      # R2, e o `pages deploy` empacota `functions/` sozinho.
      - name: Publicar
        run: npx wrangler pages deploy dist --project-name social-media-painel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# ── Como ARMAR o portão (uma vez só, tudo no painel) ──────────────────────────
#
# O job `verificar` acima já roda a cada push — ele avisa. Para o deploy passar
# a DEPENDER dele, faltam três coisas que um workflow não faz sozinho, porque
# envolvem credenciais e uma configuração do Cloudflare:
#
# 1. GitHub → Settings → Secrets and variables → Actions → New repository secret
#      · CLOUDFLARE_API_TOKEN  (Cloudflare → My Profile → API Tokens → template
#        "Edit Cloudflare Workers", ou permissão Pages:Edit no projeto)
#      · CLOUDFLARE_ACCOUNT_ID (Cloudflare → Workers & Pages → à direita)
# 2. Cloudflare → Pages → social-media-painel → Settings → Builds & deployments
#      · desligar a integração automática com o Git (senão fica deploy duplo)
# 3. GitHub → Settings → Secrets and variables → Actions → aba Variables → New
#      · CI_DEPLOY = true
#
# A ordem importa: faça 1, depois 2 e 3 juntos. A partir daí, todo push na main
# roda os testes e só publica se passarem. Voltar atrás é reverter o passo 2 e
# apagar a variável do passo 3 — sem tocar em código.
#
# Alternativa mais simples, sem secrets (protege a main, mas muda o fluxo para
# trabalhar por PR): GitHub → Settings → Branches → Add rule em `main` →
# "Require status checks to pass" marcando "typecheck · lint · testes · build".
