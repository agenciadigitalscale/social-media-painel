<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9039" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff5339" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="f">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark card background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle orange gradient overlay -->
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <!-- Orange accent bar on left -->
  <rect x="0" y="8" width="3" height="16" rx="1.5" fill="#ff9039" opacity="0.9"/>
  <!-- "D" letter -->
  <text x="8.5" y="22.5" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="17" fill="#ff9039" letter-spacing="-0.5">D</text>
  <!-- "S" letter in a slightly softer tone -->
  <text x="19" y="22.5" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="17" fill="#ff5339">S</text>
</svg>
